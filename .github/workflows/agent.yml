name: Theta Gate Agent

# Scoped V1 (docs/PLAN.md, ~/.claude/plans/i-m-starting-a-new-calm-rose.md):
# one workflow, one job. The concurrency group below is the SOLE mechanism
# preventing two ticks from overlapping -- durability is the broker itself
# plus loop.py's own deterministic client_order_id idempotency, not this
# file. Keep it this simple; the 5-workflow OIDC/watchdog/recovery version
# was deliberately cut for the hackathon timeline.

on:
  schedule:
    # All times UTC. This trading week (28 Aug - 4 Sep 2026) is Eastern
    # Daylight Time throughout (EDT = UTC-4), so 09:30-16:00 ET ==
    # 13:30-20:00 UTC. Split into three cron lines so the partial first
    # hour, the full middle hours, and the exact close-of-day tick are all
    # precise -- every 5 minutes, weekdays only. That cadence is chosen to
    # (a) reliably land inside both 15-minute entry windows (10:30 and
    # 13:30 ET) despite GitHub's documented scheduled-run jitter, and
    # (b) run exit/reconciliation logic promptly all session.
    - cron: "30,35,40,45,50,55 13 * * 1-5" # 09:30-09:55 ET
    - cron: "*/5 14-19 * * 1-5" # 10:00-15:55 ET
    - cron: "0 20 * * 1-5" # 16:00 ET (close)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no live order submission) -- for rehearsal"
        type: boolean
        default: true

concurrency:
  group: theta-gate-agent
  cancel-in-progress: false

permissions:
  contents: write # loop.py commits/pushes data/journal.jsonl itself -- nothing else needed

jobs:
  run:
    name: Run tick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # No pyproject.toml / .python-version in this repo. Matches the
          # local .venv this codebase was built and tested against this
          # session (.venv/pyvenv.cfg -> 3.14.6).
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Alpaca CLI
        # VERIFIED, not guessed: URL and sha256 below are copied verbatim
        # from the alpacahq/homebrew-tap formula actually installed locally
        # this session (github.com/alpacahq/homebrew-tap/blob/HEAD/cli.rb,
        # itself generated by GoReleaser directly from this GitHub release --
        # `brew info alpacahq/tap/cli` confirms it's the same 0.0.13 this
        # repo was built and tested against, `alpaca version` -> 0.0.13).
        # The URL was additionally confirmed live (HTTP 200) before use.
        # Pinned deliberately -- bump this on purpose, don't auto-latest it.
        run: |
          set -euo pipefail
          VERSION=0.0.13
          URL="https://github.com/alpacahq/cli/releases/download/v${VERSION}/cli_${VERSION}_linux_amd64.tar.gz"
          SHA256=50cd254d81b6bbc541259eeeb4bb1a8f7c319557fa49fc3b2765cddd72a66a82
          curl -fsSL -o cli.tar.gz "$URL"
          echo "${SHA256}  cli.tar.gz" | sha256sum -c -
          tar -xzf cli.tar.gz alpaca
          sudo install -m 755 alpaca /usr/local/bin/alpaca
          alpaca version

      - name: Configure git identity for journal commits
        # loop.py's _git_publish() shells out to `git commit` with
        # check=False and never inspects the commit's own exit code -- only
        # push's. A missing git identity makes `git commit` fail silently
        # and _git_publish still reports committed=True. Not a loop.py
        # change (out of scope this session); this just gives that path
        # what it already assumes exists.
        run: |
          git config user.name "theta-gate-agent[bot]"
          git config user.email "theta-gate-agent[bot]@users.noreply.github.com"

      - name: Configure Alpaca CLI profile (submission)
        # alpaca.py selects the profile via the ALPACA_PROFILE env var,
        # never --profile (see alpaca.py's _profile_env: `alpaca doctor
        # --profile X` was verified live this session to silently ignore
        # the flag). loop.py's --profile default is "submission", so that's
        # the profile name this step must create. --paper is passed
        # explicitly rather than left to the CLI's default -- this codebase
        # treats paper/live ambiguity as the one trap that matters most.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          alpaca profile login --api-key --paper --name submission \
            --key "$ALPACA_API_KEY" --secret "$ALPACA_SECRET_KEY"

      - name: Run Theta Gate tick
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Configured in this repo as a VARIABLE, not a secret (confirmed
          # via `gh variable list` 29 Aug 2026) -- an account id isn't
          # sensitive on its own (no more than the account_number Alpaca's
          # own dashboard shows openly), and `secrets.ALPACA_ACCOUNT_ID`
          # would silently resolve to an empty string here, tripping
          # assert_paper's "not set" check on every single tick.
          ALPACA_ACCOUNT_ID: ${{ vars.ALPACA_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Hardcoded on purpose, not secrets: this is the paper/live trap
          # documented in env.example ("THE TRAP"). Keeping both literal in
          # the committed workflow file keeps the safety invariant visible
          # in the diff itself, instead of hidden behind a secret only an
          # admin can see.
          ALPACA_PAPER_TRADE: "true"
          ALPACA_LIVE_TRADE: "false"
        run: |
          ARGS="--once --profile submission"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 loop.py $ARGS
